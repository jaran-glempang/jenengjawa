<!DOCTYPE html>
<html lang="jv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panganggit Jeneng ✦ Jawi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Noto+Serif+Javanese&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --coklat-tua: #2c1a0e;
            --coklat-mid: #5c3a1e;
            --emas: #c8922a;
            --emas-terang: #f0c060;
            --krem: #f5e9c8;
            --krem-gelap: #e8d5a0;
            --merah-jawa: #8b1a1a;
            --hijau-jawa: #2d4a2d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background-color: var(--coklat-tua);
            background-image:
                radial-gradient(ellipse 12px 8px at 20px 20px, transparent 6px, rgba(200,146,42,0.08) 6px, rgba(200,146,42,0.08) 8px, transparent 8px),
                radial-gradient(ellipse 12px 8px at 0px 0px, transparent 6px, rgba(200,146,42,0.08) 6px, rgba(200,146,42,0.08) 8px, transparent 8px),
                radial-gradient(ellipse 8px 12px at 10px 10px, transparent 4px, rgba(200,146,42,0.05) 4px, rgba(200,146,42,0.05) 6px, transparent 6px),
                linear-gradient(135deg, #1a0f08 0%, #2c1a0e 40%, #1f1208 100%);
            background-size: 40px 40px, 40px 40px, 40px 40px, 100% 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'IM Fell English', serif;
        }

        .ornamen-atas, .ornamen-bawah {
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: var(--emas);
            font-size: 1.4rem;
            letter-spacing: 0.3rem;
            opacity: 0.7;
            margin: 0.4rem 0;
            user-select: none;
        }

        .kartu {
            background: linear-gradient(160deg, #f5e9c8 0%, #ede0b0 50%, #e8d5a0 100%);
            width: 100%;
            max-width: 600px;
            border: 3px solid var(--emas);
            outline: 1px solid rgba(200,146,42,0.3);
            outline-offset: 6px;
            position: relative;
            padding: 2.5rem 2.5rem 2rem;
            box-shadow:
                0 0 0 8px rgba(44,26,14,0.8),
                0 0 0 10px var(--emas),
                0 0 40px rgba(200,146,42,0.2),
                inset 0 0 60px rgba(92,58,30,0.1);
        }

        @media (max-width: 480px) {
            body { padding: 1.5rem 0.5rem; }
            .kartu { padding: 2rem 1.2rem 1.5rem; outline-offset: 3px; }
            .sudut { font-size: 1.4rem; }
            h2 { font-size: 1.2rem; }
        }

        .sudut {
            position: absolute;
            width: 50px;
            height: 50px;
            color: var(--emas);
            font-size: 2rem;
            line-height: 1;
            opacity: 0.8;
        }
        .sudut.tl { top: 8px; left: 8px; }
        .sudut.tr { top: 8px; right: 8px; transform: scaleX(-1); }
        .sudut.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
        .sudut.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }

        .batik-bg {
            position: absolute;
            inset: 0;
            opacity: 0.04;
            background-image:
                repeating-linear-gradient(45deg, var(--coklat-tua) 0, var(--coklat-tua) 1px, transparent 0, transparent 50%),
                repeating-linear-gradient(-45deg, var(--coklat-tua) 0, var(--coklat-tua) 1px, transparent 0, transparent 50%);
            background-size: 12px 12px;
            pointer-events: none;
        }

        .isi { position: relative; z-index: 1; }

        .aksara-jawa {
            text-align: center;
            font-size: 1.8rem;
            color: var(--coklat-mid);
            opacity: 0.5;
            letter-spacing: 0.2rem;
            margin-bottom: 0.3rem;
            font-family: 'Noto Serif Javanese', serif;
        }

        .garis-emas {
            width: 80%;
            margin: 0.6rem auto;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--emas), transparent);
        }

        h2 {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--coklat-tua);
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            text-align: center;
            letter-spacing: 0.05rem;
            text-shadow: 1px 1px 0 rgba(200,146,42,0.4);
            margin-bottom: 0.2rem;
        }

        .subjudul {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--coklat-mid);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.2rem;
            opacity: 0.8;
        }

        #result-container {
            background: linear-gradient(135deg, #1a0f08, #2c1a0e);
            border: 2px solid var(--emas);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.5rem;
            margin: 1rem 0 1.2rem;
            position: relative;
            box-shadow:
                inset 0 0 30px rgba(0,0,0,0.5),
                0 0 15px rgba(200,146,42,0.15);
        }

        #result-container::before,
        #result-container::after {
            content: '✦';
            position: absolute;
            color: var(--emas);
            font-size: 0.8rem;
            opacity: 0.6;
        }
        #result-container::before { top: 4px; left: 6px; }
        #result-container::after { bottom: 4px; right: 6px; }

        .label-hasil {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--emas);
            font-size: 0.7rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 0.4rem;
        }

        #result {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--emas-terang);
            font-size: 1.5rem;
            text-align: center;
            text-shadow:
                0 0 20px rgba(240,192,96,0.4),
                1px 1px 0 rgba(0,0,0,0.5);
            line-height: 1.3;
            word-break: break-word;
            white-space: nowrap;
            width: 100%;
            overflow: hidden;
            transition: font-size 0.2s, opacity 0.3s;
        }

        #result.flash {
            animation: kilat 0.4s ease;
        }

        @keyframes kilat {
            0% { opacity: 0; transform: scale(0.95); }
            60% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        #sandhi-badge {
            display: none;
            margin-top: 0.5rem;
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 0.75rem;
            color: var(--krem-gelap);
            opacity: 0.7;
        }

        .tombol-wrapper {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        button {
            flex: 1;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.75rem;
            letter-spacing: 0.05rem;
            cursor: pointer;
            padding: 0.85rem 0.5rem;
            border: 2px solid var(--emas);
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }

        #btn-generate {
            background: linear-gradient(160deg, var(--coklat-mid), var(--coklat-tua));
            color: var(--emas-terang);
            box-shadow: 0 4px 0 #1a0a04, 0 0 15px rgba(200,146,42,0.1);
        }
        #btn-generate:hover {
            background: linear-gradient(160deg, #7a4e2a, #3d2010);
            box-shadow: 0 4px 0 #1a0a04, 0 0 25px rgba(200,146,42,0.25);
        }
        #btn-generate:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1a0a04;
        }

        #btn-salin {
            background: transparent;
            color: var(--coklat-mid);
            border-color: var(--coklat-mid);
            font-size: 0.7rem;
            flex: 0.5;
        }
        #btn-salin:hover { background: rgba(92,58,30,0.1); }
        #btn-salin:active { transform: translateY(2px); }
        #btn-salin.tersalin {
            color: var(--hijau-jawa);
            border-color: var(--hijau-jawa);
        }

        .riwayat-label {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--coklat-mid);
            font-size: 0.72rem;
            text-align: center;
            letter-spacing: 0.15rem;
            margin-bottom: 0.4rem;
            opacity: 0.7;
        }

        #riwayat {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            min-height: 28px;
        }

        .riwayat-item {
            font-family: 'IM Fell English', serif;
            font-size: 0.72rem;
            color: var(--coklat-mid);
            background: rgba(92,58,30,0.12);
            border: 1px solid rgba(92,58,30,0.3);
            padding: 2px 8px;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.8;
        }
        .riwayat-item:hover {
            background: rgba(92,58,30,0.25);
            opacity: 1;
        }

        .garis-footer {
            width: 60%;
            margin: 1rem auto 0.6rem;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--coklat-mid), transparent);
            opacity: 0.4;
        }

        .footer-note {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 0.72rem;
            color: var(--coklat-mid);
            opacity: 0.6;
        }
        .footer-note a {
            color: var(--coklat-tua);
            text-decoration: underline;
            font-weight: bold;
            opacity: 1;
        }
        .footer-note a:hover { opacity: 0.7; }
    </style>
</head>
<body>

<div class="ornamen-atas">✦ — ✦ — ✦ — ✦</div>

<div class="kartu">
    <div class="batik-bg"></div>

    <div class="sudut tl">❧</div>
    <div class="sudut tr">❧</div>
    <div class="sudut bl">❧</div>
    <div class="sudut br">❧</div>

    <div class="isi">
        <div class="aksara-jawa">ꦥꦔꦁꦒꦶꦠ꧀ꦗꦼꦤꦼꦁ</div>

        <div class="garis-emas"></div>

        <h2>Panganggit Jeneng</h2>
        <div class="subjudul">Generate Javanese family names</div>

        <div class="garis-emas"></div>

        <div id="result-container">
            <div class="label-hasil">✦ Asmanipun ✦</div>
            <div id="result">— — —</div>
            <div id="sandhi-badge"></div>
        </div>

        <div class="tombol-wrapper">
            <button id="btn-generate" onclick="generateName()">✦ Generate Name ✦</button>
            <button id="btn-salin" onclick="salinNama()">Salin</button>
        </div>

        <div class="riwayat-label">✦ Cathetaning Asma ✦</div>
        <div id="riwayat"></div>

        <div class="garis-footer"></div>
        <div class="footer-note">Ginawe dening <a href="https://x.com/NetflixJW" target="_blank">@NetflixJW</a></div>
    </div>
</div>

<div class="ornamen-bawah">✦ — ✦ — ✦ — ✦</div>

<script>
    const namaDepan = ["mangun","mangku","wojo","ambar","setyo","padmo","wedyo","wignyo","pujo","puji","puspo","sastro","pringgo","citro","sekar","ranu","danu","aryo","arum","tirto","suryo","santa","karto","wigyo","suro","ronggo","sasro","purwo","cokro","lembu","paku","bayu","noto","wrekso","sindu","yoso","sudiro","prayu","cipto","hadi","haryo","pramu","pamong","sani","narto","broto","marto","jati","midera","dirgo","jiwa","joyo","tejo","pandu","atmo","wiro","dipo","purbo","kresno","merto","cahyo","wongso","yomo","panoto","rekso","gondo","darko","hando","bodro","arung","prawoto","projo","darmo","budi"];

    const namaBelakang = ["atmojo","kusumo","sentiko","sumantri","saroso","husodo","aji","nirmolo","wiyatno","wiguno","kinanthi","asmoro","dikromo","wiloso","nugroho","wiyarti","ningrum","ningtyas","mentaram","dipuro","pasuti","tenoyo","prati","dati","darsono","anggoro","utomo","utami","wiratmo","wirono","sadewo","negaran","tyaso","pradoto","pawitro","pasuwiryo","musthiko","suyatno","sangkoyo","sarsadi","puspito","sugondo","suwanto","dirjo","darmo","suroto","yudo","pratomo","wening","lesmi","binang","wijoyo","darmojo","waluyo","suwiryo","gayatri","retno","winoto","sumantro","pranoto","amiseno","laksito","sumarto","wigati","priansari","wijatmoko","lastri","wanto","martono","dono","wardono","somo","widagdo","waskito","warsito","mudyo","winangun","alam","digdo","waseso","wiryo","setro","wardoyo","dilogo","kuncoro","karyo","projo","wibowo","hadi","siswo","amijoyo","direjo","yuwono","loyo","suwandito","siwojo","padmoyo","hantoro","darmanto","mono","yumono","nolo","dibyo","sudibyo","harjo","purwoko","sudarto","miharjo","winarso","wihastuti","diwijo","wilojo","santi","seto","seno","kartiyoso","prawoto","sayekti","legowo","guritno","handoyo"];

    let riwayat = [];
    let namaTerakhir = '';

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function fitFontSize(el) {
        el.style.whiteSpace = 'nowrap';
        el.style.fontSize = '1.5rem';

        const container = el.parentElement;
        // Hitung maxWidth dari lebar container yang sebenarnya (responsif)
        const containerStyle = window.getComputedStyle(container);
        const paddingH = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight);
        const maxWidth = container.clientWidth - paddingH - 8;

        const sizes = ['1.5rem', '1.25rem', '1.05rem', '0.9rem', '0.78rem', '0.68rem'];
        for (const size of sizes) {
            el.style.fontSize = size;
            if (el.scrollWidth <= maxWidth) break;
        }
    }

    function generateName() {
        let d = namaDepan[Math.floor(Math.random() * namaDepan.length)];
        let b = namaBelakang[Math.floor(Math.random() * namaBelakang.length)];

        let namaAsli = capitalize(d + b);
        let finalDisplay = namaAsli;
        let sandhi = '';

        let dLast = d.charAt(d.length - 1);
        let bFirst = b.charAt(0);

        if ((dLast === 'o' && bFirst === 'a') ||
            (dLast === 'a' && bFirst === 'a') ||
            (dLast === 'a' && bFirst === 'i') ||
            (dLast === 'o' && bFirst === 'u') ||
            (dLast === 'i' && bFirst === 'a')) {
            let namaSandhi = capitalize(d.slice(0, -1) + b);
            finalDisplay = namaAsli;
            sandhi = 'ugi saged: ' + namaSandhi;
        }

        namaTerakhir = finalDisplay;

        const resultDiv = document.getElementById('result');
        const sandhiBadge = document.getElementById('sandhi-badge');

        resultDiv.classList.remove('flash');
        void resultDiv.offsetWidth;
        resultDiv.classList.add('flash');

        resultDiv.innerText = finalDisplay;
        fitFontSize(resultDiv);

        if (sandhi) {
            sandhiBadge.style.display = 'block';
            sandhiBadge.innerText = sandhi;
        } else {
            sandhiBadge.style.display = 'none';
        }

        if (!riwayat.includes(finalDisplay)) {
            riwayat.unshift(finalDisplay);
            if (riwayat.length > 4) riwayat.pop();
            renderRiwayat();
        }
    }

    function renderRiwayat() {
        const el = document.getElementById('riwayat');
        el.innerHTML = riwayat.map(n =>
            `<span class="riwayat-item" onclick="pakaiNama('${n}')">${n}</span>`
        ).join('');
    }

    function pakaiNama(nama) {
        namaTerakhir = nama;
        const resultDiv = document.getElementById('result');
        resultDiv.classList.remove('flash');
        void resultDiv.offsetWidth;
        resultDiv.classList.add('flash');
        resultDiv.innerText = nama;
        fitFontSize(resultDiv);
        document.getElementById('sandhi-badge').style.display = 'none';
    }

    function salinNama() {
        if (!namaTerakhir || namaTerakhir === '— — —') return;
        navigator.clipboard.writeText(namaTerakhir).then(() => {
            const btn = document.getElementById('btn-salin');
            btn.innerText = '✓ Kasalin';
            btn.classList.add('tersalin');
            setTimeout(() => {
                btn.innerText = 'Salin';
                btn.classList.remove('tersalin');
            }, 1500);
        });
    }

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
            e.preventDefault();
            generateName();
        }
    });
</script>

</body>
</html>
